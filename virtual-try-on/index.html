<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Virtual Try-On 98</title>
    <link rel="stylesheet" href="css/base.css" />
  </head>
  <body>
    <div class="window raised">
      <div class="title-bar">
        Virtual Try-On 98 <button class="close-btn">X</button>
      </div>
      <div class="menu-bar">
        <span>File</span>
        <span>Edit</span>
        <span>View</span>
        <span>Help</span>
        <div class="upload-group">
          <button>Upload Tops</button>
          <button>Upload Bottoms</button>
        </div>
      </div>
      <main class="content">
        <div class="left-column">
          <div class="panel sunken">
            <h2>Tops</h2>
            <div class="carousel">
              <button>◀</button>
              <img src="https://placehold.co/150x180" alt="top.png" />
              <button>▶</button>
            </div>
          </div>
          <div class="panel sunken">
            <h2>Bottoms</h2>
            <div class="carousel">
              <button>◀</button>
              <img src="https://placehold.co/150x180" alt="bottom.png" />
              <button>▶</button>
            </div>
          </div>
        </div>
        <div class="preview sunken">
          <img src="https://placehold.co/300x400" alt="model" />
        </div>
      </main>
      <div class="actions">
        <button>Random</button>
        <button>Select</button>
        <button>Remove Garments</button>
        <button>Outfit Transfer</button>
      </div>
    </div>
    <script src="js/main.js"></script>
  </body>
</html>
