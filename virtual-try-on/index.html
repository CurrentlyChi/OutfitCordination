<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Virtual Try-On 98</title>
    <link rel="stylesheet" href="css/base.css" />
  </head>
  <body>
    <div class="window raised">
      <div class="title-bar">
        Virtual Try-On 98 <button class="close-btn">X</button>
      </div>
      <div class="menu-bar">
        <span>File</span>
        <span>Edit</span>
        <span>View</span>
        <span>Help</span>
        <div class="upload-group">
          <button>Upload Tops</button>
          <button>Upload Bottoms</button>
        </div>
      </div>
      <main class="content">
        <div class="left-column">
          <div class="panel sunken">
            <h2>Tops</h2>
            <div class="carousel">
              <button id="top-previous-button">◀</button>
              <img
                id="top-img"
                src="https://placehold.co/150x180"
                alt="top.png"
              />
              <button id="top-next-button">▶</button>
            </div>
          </div>
          <div class="panel sunken">
            <h2>Bottoms</h2>
            <div class="carousel">
              <button id="bottom-previous-button">◀</button>
              <img
                id="bottom-img"
                src="https://placehold.co/150x180"
                alt="bottom.png"
              />
              <button id="bottom-next-button">▶</button>
            </div>
          </div>
        </div>
        <div class="preview sunken">
          <img
            id="preview-img"
            src="https://placehold.co/300x400"
            alt="model"
          />
        </div>
      </main>
      <div class="actions">
        <button id="random-button">Random</button>
        <button id="select-button">Select</button>
        <button>Remove Garments</button>
        <button id="outfittranfer-button">Outfit Transfer</button>
      </div>
      <div class="progress-window raised">
        <div class="title-bar" id="progress-title"></div>
        <div class="sunken" id="blue-rectangular"></div>
        <button id="cancel-button">Cancel</button>
      </div>
    </div>
    <script src="js/main.js"></script>
  </body>
</html>
